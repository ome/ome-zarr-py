# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  # napari needs a screen to generate screenshots, so we need to install xvfb
  # and run the build in a virtual screen
  apt_packages:
    - xvfb
    - libgl1
    - libgl1-mesa-dri
    - libegl1
    - libopengl0
    - libdbus-1-3
    - libxkbcommon-x11-0
    - libxcb-cursor0
    - libxcb-icccm4
    - libxcb-image0
    - libxcb-keysyms1
    - libxcb-randr0
    - libxcb-render-util0
    - libxcb-shape0
    - libxcb-xinerama0
    - libxcb-xinput0
    - libxcb-xfixes0

# Build documentation in the docs/ directory with Sphinx
sphinx:
  fail_on_warning: false
  configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Optionally declare the Python requirements required to build your docs
python:
  install:
  - method: uv
    command: sync
    groups:
      - docs
