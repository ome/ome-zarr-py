name: Build docs

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-docs:
    name: Build docs (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Qt
        uses: tlambert03/setup-qt-libs@v1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build docs
        uses: aganders3/headless-gui@v2
        with:
          run: uv run --no-sync sphinx-build -b html docs/source docs/build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/build
